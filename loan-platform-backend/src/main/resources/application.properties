spring.config.import=optional:file:.env[.properties]

# =========================================================
# APPLICATION
# =========================================================

spring.application.name=${SPRING_APPLICATION_NAME:loan-platform}

server.port=${SERVER_PORT:8080}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# =========================================================
# POSTGRESQL
# =========================================================

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}


# =========================================================
# FILE UPLOADS
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =========================================================
# GMAIL SMTP
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# MESSAGECENTRAL
# =========================================================

messagecentral.customer-id=${MESSAGECENTRAL_CUSTOMER_ID}
messagecentral.email=${MESSAGECENTRAL_EMAIL}
messagecentral.password=${MESSAGECENTRAL_PASSWORD}


# =========================================================
# DEVELOPMENT SUPER ADMIN
# =========================================================

superadmin.email=${SUPERADMIN_EMAIL}
superadmin.password=${SUPERADMIN_PASSWORD}


# =========================================================
# GOOGLE OAUTH2
# =========================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/{registrationId}}
